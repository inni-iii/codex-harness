version = 1

[[routes]]
name = "evidence"
when = "질문에 필요한 원문·반증·조건을 조사할 때"
kind = "research"
inputs = ["request"]
documents = [".agents/skills/research/references/evidence.md"]
validation = "요청·관련 절차에서 정한 정상/오류/경계와 실제 결과·남은 한계를 대조한다. 실행·증거 연결만으로 내용의 진위를 자동 승인하지 않는다."
evidence_types = ["artifact"]
required_calls = []
finish = true
[[routes.steps]]
id = "scope"
instruction = "질문·범위와 필요한 근거를 정한다"
[[routes.steps]]
id = "execute"
instruction = "원문과 대안·반증·버전/날짜를 대조한다"
[[routes.steps]]
id = "inspect"
instruction = "결론·한계·출처와 후속 질문을 정리한다"

[[routes]]
name = "retrieval"
when = "문서·코드·기록에서 필요한 근거만 찾을 때"
kind = "research"
inputs = ["request"]
documents = [".agents/skills/research/references/retrieval.md"]
validation = "요청·관련 절차에서 정한 정상/오류/경계와 실제 결과·남은 한계를 대조한다. 실행·증거 연결만으로 내용의 진위를 자동 승인하지 않는다."
evidence_types = ["artifact"]
required_calls = []
finish = true
[[routes.steps]]
id = "scope"
instruction = "찾을 질문과 탐색 범위를 정한다"
[[routes.steps]]
id = "execute"
instruction = "관련 지도와 좁은 검색으로 원문을 읽는다"
[[routes.steps]]
id = "inspect"
instruction = "찾은 근거·누락·다음 읽을 조건을 확인한다"


[[routes]]
name = "analyze-data"
when = "지정한 CSV/JSON·표·사건 데이터에서 질문에 맞는 검증 가능한 발견을 도출할 때"
kind = "research"
inputs = ["request"]
documents = [".agents/skills/research/references/data-analysis.md"]
validation = "질문·원본 식별자/보존·실제 처리 건수·관측 단위·품질/지표별 분모·변환/조인 불변식·방법 가정·민감도·수치/기간/불확실성과 재현 근거를 대조한다. 표본/파싱 성공을 전체 분석/인과 증명으로 바꾸지 않는다."
evidence_types = ["artifact"]
required_calls = []
finish = true
[[routes.steps]]
id = "scope"
instruction = "질문·판단·대상/기간·관측 단위·원본/권한·예산과 지표/분모를 정한다"
[[routes.steps]]
id = "execute"
instruction = "원본 보존 아래 실제 품질/정제/집계·질문에 맞는 분석을 수행하고 처리 건수·반례·재현 근거를 남긴다"
[[routes.steps]]
id = "inspect"
instruction = "수치·분모·불확실성·대안/민감도와 질문의 답·다음 행동을 대조하고 미검증/자료 부족을 구분한다"
